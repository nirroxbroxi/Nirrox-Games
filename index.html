<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nirrox Games - Beta 1.1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="Nirrox Games.png">
<style>
:root{--bg:#0f0f12;--card:#17171c;--surface:#202027;--text:#f4f4f6;--muted:#9a9aa6;--line:#2a2a33;--accent:#4f46e5;--accent-soft:#1b2540}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55;min-height:100vh;display:flex;flex-direction:column;padding-bottom:70px}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;background:rgba(15,15,18,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
.nav{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.links{display:flex;gap:4px}
.links a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:.95rem;cursor:pointer}
.links a:hover,.links a.on{color:var(--text);background:var(--surface)}
main{max-width:1120px;width:100%;margin:0 auto;padding:40px 24px;flex:1}
.intro h1{font-size:clamp(1.8rem,4vw,2.4rem);margin:0 0 8px;letter-spacing:-.025em}
.intro p{margin:0;color:var(--muted);max-width:480px}
.count{font-size:.85rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;margin-top:24px}
.soon{margin-top:40px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:30px;border-radius:14px}
.soon strong{display:block;color:var(--text);font-size:1.1rem;margin-bottom:6px}
.about{max-width:620px}.about h1{font-size:2rem;margin-bottom:12px}.about p{color:var(--muted);margin-bottom:14px;line-height:1.6}
/* Banderole fixe en bas */
#banderole-bas{position:fixed;bottom:0;left:0;width:100%;background-color:#16161a;border-top:1px solid var(--line);padding:12px 20px;z-index:1000;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:0.85rem;box-sizing:border-box}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="#" onclick="afficherPage('jeux')">
      <img src="Nirrox Games.png" alt="Logo" width="28" height="28" style="border-radius:6px;">
      <span>Nirrox Games</span>
    </a>
    <div class="links">
      <a id="btn-jeux" class="on" onclick="afficherPage('jeux')">Jeux</a>
      <a id="btn-apropos" onclick="afficherPage('apropos')">À propos</a>
    </div>
  </div>
</header>

<main id="app">
  <!-- Contenu injecté dynamiquement par JavaScript -->
</main>

<!-- Banderole de bas de page (fixée au scroll) -->
<div id="banderole-bas">
  <div style="color: #f59e0b; font-weight: bold;">
    🎮 Aucun jeu disponible pour le moment... Allez !
  </div>
  <div style="color: #d4d4d8; max-width: 600px; font-size: 0.8rem;">
    <strong style="color: #4f46e5;">Pourquoi Nirrox Games ?</strong> 
    Créer un espace indépendant et fun entre amis, partager nos créations, progresser et bâtir une communauté passionnée ! 🚀
  </div>
  <div>
    <a href="https://discord.gg/vhmXpuRUa" target="_blank" style="background-color: #5865F2; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.8rem;">
      Discord
    </a>
  </div>
</div>

<script>
// Date de lancement (ajuste l'heure si besoin)
const DATE_LANCEMENT_SITE = new Date("2026-11-03T19:00:00");

function mettreAJourAgeSite() {
  const el = document.getElementById("compteur-age");
  if (!el) return;
  const diff = new Date() - DATE_LANCEMENT_SITE;
  if (diff < 0) { el.textContent = "Lancement imminent !"; return; }
  
  const j = Math.floor(diff / (1000 * 60 * 60 * 24));
  const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const m = Math.floor((diff / (1000 * 60)) % 60);
  const s = Math.floor((diff / 1000) % 60);

  if (j > 0) {
    el.textContent = `${j} jour(s), ${h}h ${m}m ${s}s`;
  } else if (h > 0) {
    el.textContent = `${h}h ${m}m ${s}s`;
  } else {
    el.textContent = `${m} minute(s) et ${s} seconde(s)`;
  }
}

// Gestion des pages (Jeux / À propos)
function afficherPage(page) {
  const app = document.getElementById('app');
  const btnJeux = document.getElementById('btn-jeux');
  const btnApropos = document.getElementById('btn-apropos');

  if (page === 'jeux') {
    btnJeux.classList.add('on');
    btnApropos.classList.remove('on');
    app.innerHTML = `
      <section class="intro" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:28px;">
        <div>
          <h1>Joue directement,<br>sans rien installer.</h1>
          <p>Une collection de jeux jouables dans ton navigateur, sur ordinateur comme sur mobile (Version Beta 1.1).</p>
        </div>
        <span class="count">0 jeu</span>
      </section>

      <!-- Chronomètre âge du site -->
      <div style="background:var(--card); border:1px solid #38bdf8; padding:15px 20px; border-radius:12px; margin-bottom:24px; text-align:center;">
        <span style="color:#38bdf8; font-weight:bold;">⏳ Âge du site : </span>
        <span id="compteur-age" style="font-family:monospace; font-weight:bold;">Calcul...</span>
      </div>

      <div class="soon">
        <strong>Les premiers jeux arrivent bientôt.</strong>
        <p style="margin:6px 0 0; color:var(--muted);">Le site est tout récent, reviens d’ici quelques jours ou rejoins notre Discord !</p>
      </div>
    `;
    mettreAJourAgeSite();
  } else if (page === 'apropos') {
    btnApropos.classList.add('on');
    btnJeux.classList.remove('on');
    app.innerHTML = `
      <div class="about">
        <h1>À propos de Nirrox Games</h1>
        <p>Ce site rassemble les projets et jeux indépendants que nous créons. Ils sont pensés pour être joués directement dans le navigateur, sans téléchargement et entre amis.</p>
        <p>Le site est actuellement en <strong>Version Beta 1.1</strong> : l'infrastructure se met en place et de superbes nouveautés arriveront très bientôt !</p>
        <a href="https://discord.gg/vhmXpuRUa" target="_blank" style="display:inline-block; background:#5865F2; color:#fff; padding:10px 20px; border-radius:8px; font-weight:600; margin-top:10px;">
          Rejoindre notre Discord
        </a>
      </div>
    `;
  }
  window.scrollTo(0, 0);
}

// Lancement par défaut sur la page jeux
afficherPage('jeux');
setInterval(mettreAJourAgeSite, 1000);
</script>

</body>
</html>
