<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nirrox Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ton en-tête normal -->
  <header class="navbar">
    <div class="nav-gauche">
      <a href="index.html">
        <img src="Nirrox Games.png" alt="Logo Nirrox Games" class="logo-img">
      </a>
    </div>
    <h1 class="nav-titre">Nirrox Games</h1>
    <span class="nav-version">Version Alpha 0.3</span>
  </header>

  <!-- Le contenu principal de ton site -->
  <main id="contenu-site" style="padding: 40px; text-align: center;">
    <h2>Bienvenue sur Nirrox Games !</h2>
    <p>Le site est ouvert et fonctionne normalement.</p>
  </main>

  <!-- Script pour gérer la maintenance -->
  <script src="maintenance.js"></script>
  <script>
    // Si modeMaintenance est à true, on remplace le contenu de la page
    if (typeof modeMaintenance !== 'undefined' && modeMaintenance === true) {
      document.body.innerHTML = `
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #121214; color: #ffffff; font-family: sans-serif; text-align: center; padding: 20px;">
          <h1 style="color: #ef4444; font-size: 2.5rem; margin-bottom: 10px;">🛠️ Site en Maintenance</h1>
          <p style="font-size: 1.2rem; color: #a1a1aa;">Nirrox Games fait peau neuve ou met à jour ses jeux. Revenez très vite !</p>
        </div>
      `;
    }
  </script>

</body>
</html>
